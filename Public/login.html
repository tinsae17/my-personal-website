<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 90%;
            max-width: 400px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 5px;

            background: #007bff;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <h1>Admin Login</h1>

        <p class="subtitle">
            Sign in to your dashboard
        </p>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;


                message.textContent = "Logging in...";


                try {

                    const response = await fetch(
                        "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                username,
                                password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (data.success) {

                        message.textContent =
                            "Login successful!";

                        // Go to dashboard
                        window.location.href =
                            "/admin.html";

                    } else {

                        message.textContent =
                            data.message;

                    }

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                }

            }
        );

    </script>

</body>

</html>
